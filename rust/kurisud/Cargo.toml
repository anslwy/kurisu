[package]
name = "kurisud"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Kurisu runtime: lean session server driving the user's own claude and codex CLIs"

[dependencies]
claude-cli-acp = { path = "../claude-cli-acp" }
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "io-std", "time", "fs", "net", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
