[workspace]
resolver = "2"
members = ["claude-cli-acp", "kurisud"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
agent-client-protocol = "5"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "fs", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
