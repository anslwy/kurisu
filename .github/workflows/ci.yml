name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          V: 8.21.2
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Scan
        run: ./gitleaks git --log-opts="--all" --redact -c .gitleaks.toml .

  paths:
    name: hard-coded path linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint-paths.py

  core:
    name: kurisu core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest -q

  legacy-broker:
    name: legacy guest-hosting broker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'legacy/guest-hosting/broker' pytest
      # Kernel-backed sandbox tests skip themselves where systemd-run/bwrap are unavailable.
      - run: python -m pytest -q
        working-directory: legacy/guest-hosting/broker

  legacy-transport:
    name: legacy whatsmeow gateway (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: legacy/guest-hosting/transport/whatsmeow-gateway/go.mod
      - run: go test ./... && go vet ./...
        working-directory: legacy/guest-hosting/transport/whatsmeow-gateway

  rust:
    name: rust runtime (kurisu, claude-cli-acp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace
        working-directory: rust
      - run: cargo build --release --target x86_64-unknown-linux-musl --workspace
        working-directory: rust
      - run: ls -la target/x86_64-unknown-linux-musl/release/kurisu target/x86_64-unknown-linux-musl/release/claude-cli-acp
        working-directory: rust
