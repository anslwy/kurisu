name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          V: 8.21.2
          GH_TOKEN: ${{ github.token }}
        run: |
          # These official API asset IDs belong to the same pinned v8.21.2 release.
          # A release-download HTTP504 must not skip the checksum or secret scan.
          download() {
            local name="$1" asset_id="$2"
            if ! curl --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 15 --max-time 60 -fsSL \
              "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${name}" -o "$name"; then
              echo "Release download failed; trying the pinned official GitHub API asset"
              timeout 90 gh api -H 'Accept: application/octet-stream' \
                "repos/gitleaks/gitleaks/releases/assets/${asset_id}" > "$name"
            fi
          }
          download "gitleaks_${V}_linux_x64.tar.gz" 202338480
          download "gitleaks_${V}_checksums.txt" 202338452
          grep "linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
      - name: Scan
        run: ./gitleaks git --log-opts="--all" --redact -c .gitleaks.toml .

  paths:
    name: hard-coded path linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint-paths.py

  web-ui:
    name: web UI (svelte-check, build, embedded dist is fresh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/kurisu/web/package-lock.json
      - run: npm ci
        working-directory: crates/kurisu/web
      - run: npm run check
        working-directory: crates/kurisu/web
      - run: npm test
        working-directory: crates/kurisu/web
      - run: npm run build
        working-directory: crates/kurisu/web
      - name: Fail if the committed dist differs from a fresh build
        run: |
          git status --porcelain crates/kurisu/web/dist
          git diff --exit-code --stat -- crates/kurisu/web/dist
          test -z "$(git status --porcelain crates/kurisu/web/dist)" || { echo "web/dist is stale: run 'npm run build' in crates/kurisu/web and commit"; exit 1; }

  rust-linux:
    name: rust (linux, static musl release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace
      - run: cargo build --release --target x86_64-unknown-linux-musl --workspace
      - name: CLI subset startup and model routing (local mocks)
        run: python3 scripts/test-cli-matrix.py target/x86_64-unknown-linux-musl/release/ku
      - name: Stop and queued-turn regressions (isolated local ACP)
        run: |
          python3 scripts/test-stop-stuck.py target/x86_64-unknown-linux-musl/release/ku
          python3 scripts/test-web-queue.py target/x86_64-unknown-linux-musl/release/ku
      - name: Five deployment handovers under phone and API load
        run: |
          python3 scripts/test-deploy.py target/x86_64-unknown-linux-musl/release/ku
          python3 scripts/test-deploy-recycle-failure.py target/x86_64-unknown-linux-musl/release/ku --tmpdir "$RUNNER_TEMP"
      - run: ls -la target/x86_64-unknown-linux-musl/release/kurisu target/x86_64-unknown-linux-musl/release/claude-cli-acp

  rust-macos:
    name: rust (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      - run: ./target/release/kurisu status
        env:
          KURISU_HOME: /tmp/kurisu-ci
