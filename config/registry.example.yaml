# Server-enforced user -> ONE guest session mapping (EXAMPLE, placeholders only).
#
# Copy to config/registry.local.yaml, chmod 600, then let `guest-broker provision`
# write the session_id (or fill it in by hand). The broker enforces:
#   * one session_id per user, and one user per session_id;
#   * workspace == <guests_root>/<user_id>/workspace;
#   * no transport-supplied session ids are ever accepted.
version: 1
users:
  pilot-001:
    # Opaque id of the single Omnigent session that speaks for this guest.
    # Until the operator creates that session it stays a placeholder and the
    # broker refuses to start (fail closed).
    session_id: __REQUIRED__
    workspace: __REQUIRED__     # /run/media/<user>/SDCARD/distrobox/omni/guests/pilot-001/workspace
    enabled: true
    label: "pilot guest 1"
