[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kurisu"
version = "0.0.1.dev0"
description = "Self-hosted lead + staff agent team, driven through Telegram or a local web UI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
kurisu = "kurisu.cli:main"

[tool.setuptools.packages.find]
include = ["kurisu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
