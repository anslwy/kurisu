# Kurisu install config (placeholders only). Copy next to roster.yaml.
version: 1
data_dir: ""                    # default: $XDG_DATA_HOME/kurisu (~/.local/share/kurisu)
roster: roster.yaml
runtime:
  kind: omnigent
  server_url: http://127.0.0.1:6767   # your own local Omnigent server (loopback only)
channels:
  telegram:
    enabled: true
    token_env: KURISU_TELEGRAM_TOKEN  # NAME of the env var holding your BotFather token
    owner_id: "<OWNER_ID>"
  web:
    enabled: false
    bind: 127.0.0.1
    port: 8686
  whatsapp:
    enabled: false              # unofficial client; may get the account banned (docs/terms-check.md)
budget:
  daily_usd: 0                  # 0 = subscription only, no API-key spend
  max_concurrent_staff: 2
sandbox:
  default: none                 # none = trusted local mode | podman (Phase 2)
backup:
  age_recipient: ""             # your age public key (age1...); empty = backups off
