<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1621">
<title>Kurisu</title>
<style>
:root{
  --bg:#0e1621; --side:#17212b; --side2:#1c2733; --line:#24313d; --text:#e9edf0; --dim:#7f8b96;
  --accent:#3390ec; --mine:#2b5278; --card:#182533; --warn:#e0a33a; --bad:#e05c5c; --ok:#4fd18b;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
#app{display:flex;height:100dvh;overflow:hidden}

/* ---------------- sidebar ---------------- */
#side{width:320px;flex:0 0 320px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side header{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
#side h1{font-size:16px;margin:0;flex:1;letter-spacing:.02em}
#side .toggle{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
#list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.row{display:flex;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;align-items:flex-start}
.row:hover{background:var(--side2)}
.row.on{background:#2b5278}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:grid;place-items:center;font-weight:600;font-size:14px;
  background:linear-gradient(160deg,#3a6ea5,#2b5278);color:#fff;text-transform:uppercase}
.row.arch .avatar{background:#2a3641;color:var(--dim)}
.who{flex:1;min-width:0}
.top{display:flex;gap:8px;align-items:baseline}
.name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.time{font-size:11px;color:var(--dim);flex:0 0 auto}
.preview{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#55606b;flex:0 0 8px;margin-top:6px}
.dot.working{background:var(--ok);box-shadow:0 0 0 0 rgba(79,209,139,.7);animation:pulse 1.6s infinite}
.dot.paused{background:var(--warn)}
.dot.archived{background:#3a4652}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(79,209,139,.6)}70%{box-shadow:0 0 0 7px rgba(79,209,139,0)}100%{box-shadow:0 0 0 0 rgba(79,209,139,0)}}
#empty{color:var(--dim);padding:18px;font-size:13px}

/* ---------------- main ---------------- */
#main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:
  radial-gradient(1200px 600px at 80% -10%, #16222f 0%, transparent 60%),var(--bg)}
#topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(23,33,43,.85);
  backdrop-filter:blur(6px);min-height:56px}
#menu{display:none;background:none;border:0;font-size:20px;padding:2px 6px;cursor:pointer}
#title{font-weight:600}
#sub{font-size:12px;color:var(--dim)}
#net{font-size:11px;color:var(--warn);margin-left:auto;display:none}
#net.on{display:block}

#msgs{flex:1;overflow:auto;padding:16px 6px 8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
#more{align-self:center;margin:4px 0 10px;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:14px;padding:5px 12px;font-size:12px;cursor:pointer}
#more[hidden]{display:none}
.b{max-width:min(680px,82%);padding:8px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap;word-wrap:break-word;
  overflow-wrap:anywhere;font-size:14.5px}
.b .meta{font-size:11px;color:var(--dim);margin-bottom:2px;font-weight:500}
.b.user{align-self:flex-end;background:var(--mine);border-bottom-right-radius:5px}
.b.agent{align-self:flex-start;border-bottom-left-radius:5px}
.b.peer{align-self:flex-start;border:1px solid #2d4360;background:#1a2a3b}
.b.error{align-self:flex-start;background:#3a1f24;border:1px solid #6b2b33;color:#ffb9b9}
.b.approval{align-self:flex-start;background:#332a17;border:1px solid #6a551f;color:#ffe1a8}
.b.compaction{align-self:center;color:var(--dim);font-style:italic;font-size:13px;background:transparent;border:1px dashed var(--line)}
.b.tool{align-self:flex-start;font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:#101a24;border:1px solid var(--line);
  max-width:min(760px,92%);padding:7px 10px}
.b.tool .head{display:flex;gap:8px;align-items:center;color:#9fd1ff;margin-bottom:2px}
.b.tool .st{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.b.tool pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;color:#b9c6d2;max-height:220px;overflow:auto}
.b.pending{opacity:.55}
.sys{align-self:center;font-size:12px;color:var(--dim);margin:6px 0}

#composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:var(--side)}
#ta{flex:1;resize:none;background:var(--side2);border:1px solid var(--line);border-radius:18px;padding:10px 14px;max-height:140px;
  outline:none;line-height:1.35}
#ta:focus{border-color:#33546f}
#send{background:var(--accent);border:0;border-radius:18px;padding:0 18px;cursor:pointer;font-weight:600}
#send:disabled{opacity:.55;cursor:default}

#scrim{display:none}
@media (max-width:760px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-102%);transition:transform .18s ease;width:86vw;flex-basis:86vw;box-shadow:8px 0 24px rgba(0,0,0,.4)}
  body.open #side{transform:none}
  #menu{display:block}
  body.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10}
  .b{max-width:88%}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Kurisu</h1>
      <label class="toggle"><input type="checkbox" id="arch"> archived</label>
    </header>
    <ul id="list"></ul>
    <div id="empty" hidden>No sessions yet.</div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div id="topbar">
      <button id="menu" aria-label="Sessions">☰</button>
      <div style="min-width:0">
        <div id="title">Kurisu</div>
        <div id="sub">pick a session</div>
      </div>
      <div id="net">reconnecting…</div>
    </div>
    <div id="msgs"></div>
    <form id="composer" autocomplete="off">
      <textarea id="ta" rows="1" placeholder="Message the session…"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const state = { sessions: [], byId: {}, current: null, firstSeq: null, lastSeq: 0, seen: new Set(), pending: new Map(), es: null, atBottom: true };

function api(path, opts){
  return fetch(path, Object.assign({credentials:"same-origin", cache:"no-store"}, opts||{}))
    .then(async r => { const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || ("HTTP "+r.status)); return j; });
}
const esc = s => String(s==null?"":s);
const hhmm = ts => { if(!ts) return ""; const d = new Date(ts*1000), n = new Date();
  const same = d.toDateString() === n.toDateString();
  return same ? d.toTimeString().slice(0,5) : d.toLocaleDateString(undefined,{day:"numeric",month:"short"}); };
const initial = name => (name||"?").replace(/[^A-Za-z0-9]/g,"").slice(0,2) || "?";

function status(s){
  const a = s.activity;
  if(s.lifecycle === "archived") return "archived";
  if(a && a.state === "running") return "working";
  if(s.status === "working") return "working";
  if(s.lifecycle === "paused") return "paused";
  return "idle";
}
function label(s){ const st = status(s); return st==="working" ? (s.activity && s.activity.tool ? "working · "+s.activity.tool : "working") : st; }

function renderList(){
  const list = $("#list"); list.textContent = "";
  const showArch = $("#arch").checked;
  const rows = state.sessions.filter(s => showArch || s.lifecycle !== "archived");
  $("#empty").hidden = rows.length > 0;
  for(const s of rows){
    const li = document.createElement("li");
    li.className = "row" + (state.current && state.current.id === s.id ? " on" : "") + (s.lifecycle === "archived" ? " arch" : "");
    li.dataset.id = s.id;
    const av = document.createElement("div"); av.className = "avatar"; av.textContent = initial(s.name);
    const who = document.createElement("div"); who.className = "who";
    const top = document.createElement("div"); top.className = "top";
    const nm = document.createElement("div"); nm.className = "name"; nm.textContent = s.name;
    const tm = document.createElement("div"); tm.className = "time"; tm.textContent = hhmm(s.last && s.last.at);
    top.append(nm, tm);
    const pv = document.createElement("div"); pv.className = "preview";
    const last = s.last;
    pv.textContent = last ? ((last.role === "user" ? "You: " : "") + esc(last.text)).replace(/\s+/g," ").slice(0,90) : label(s);
    who.append(top, pv);
    const dot = document.createElement("span"); dot.className = "dot " + status(s); dot.title = label(s);
    li.append(av, who, dot);
    li.addEventListener("click", () => { select(s); document.body.classList.remove("open"); });
    list.append(li);
  }
}

function bubble(m){
  const cls = kind(m.role);
  const el = document.createElement("div");
  el.className = "b " + cls;
  if(cls === "tool"){
    const head = document.createElement("div"); head.className = "head";
    const name = document.createElement("span"); name.textContent = (m.data && m.data.tool) || "tool";
    const st = document.createElement("span"); st.className = "st"; st.textContent = (m.data && m.data.status) || "";
    head.append(name, st);
    el.append(head);
    const body = m.data && (m.data.input || m.data.output);
    if(body){
      const pre = document.createElement("pre");
      pre.textContent = typeof body === "string" ? body : JSON.stringify(body, null, 1);
      el.append(pre);
    }
    if(m.text && (!m.data || !m.data.tool)) { el.append(document.createTextNode(m.text)); }
  } else {
    const meta = document.createElement("div"); meta.className = "meta";
    meta.textContent = (cls === "user" ? "You" : cls === "peer" ? peerName(m.role) : cls === "approval" ? "approval" : cls === "error" ? "error" : cls === "agent" ? state.current.name : "") + " · " + hhmm(m.at);
    if(cls !== "compaction") el.append(meta);
    el.append(document.createTextNode(m.text || (m.data ? JSON.stringify(m.data) : "")));
  }
  if(m.seq) el.dataset.seq = m.seq;
  return el;
}
function kind(role){
  if(role === "user") return "user";
  if(role === "agent") return "agent";
  if(role === "tool") return "tool";
  if(role === "error") return "error";
  if(role === "approval") return "approval";
  if(role === "compaction") return "compaction";
  return "peer";
}
function peerName(id){ const s = state.byId[id]; return s ? s.name : "peer"; }

function scrollable(){ const m = $("#msgs"); return m.scrollHeight - m.scrollTop - m.clientHeight; }
function bottom(force){ const m = $("#msgs"); if(force || state.atBottom) m.scrollTop = m.scrollHeight; }
$("#msgs").addEventListener("scroll", () => { state.atBottom = scrollable() < 120; });

function reset(){
  const m = $("#msgs"); m.textContent = "";
  state.firstSeq = null; state.lastSeq = 0; state.seen.clear(); state.pending.clear();
  const more = document.createElement("button"); more.id = "more"; more.textContent = "↑ earlier messages"; more.hidden = true;
  more.addEventListener("click", () => loadEarlier());
  m.append(more);
}

function add(m){
  if(!m.seq || state.seen.has(m.seq)) return;
  state.seen.add(m.seq);
  const pend = state.pending.get(m.seq);
  if(pend){ pend.remove(); state.pending.delete(m.seq); }
  if(state.firstSeq === null) state.firstSeq = m.seq;
  state.lastSeq = Math.max(state.lastSeq, m.seq);
  $("#msgs").append(bubble(m));
  bottom(false);
}

async function loadEarlier(){
  if(!state.current || state.firstSeq === null) return;
  const id = state.current.id;
  const r = await api(`/_web/api/sessions/${encodeURIComponent(id)}/messages?before=${state.firstSeq}&limit=60`);
  const msgs = (r.messages||[]).filter(m => !state.seen.has(m.seq));
  const anchor = $("#msgs").scrollHeight;
  for(const m of msgs){ state.seen.add(m.seq); $("#msgs").insertBefore(bubble(m), $("#msgs").children[1] || null); }
  if(msgs.length) state.firstSeq = Math.min(...msgs.map(m=>m.seq), state.firstSeq);
  $("#more").hidden = !r.has_more;
  $("#msgs").scrollTop = $("#msgs").scrollHeight - anchor;
}

async function select(s){
  state.current = s; localStorage.setItem("ku_web_session", s.id);
  $("#title").textContent = s.name;
  $("#sub").textContent = [s.role, s.harness, s.model, label(s)].filter(Boolean).join(" · ");
  renderList(); reset();
  try{
    const r = await api(`/_web/api/sessions/${encodeURIComponent(s.id)}/messages?limit=60`);
    for(const m of (r.messages||[])) add(m);
    $("#more").hidden = !r.has_more;
    bottom(true);
  }catch(e){ sys("Could not load history: " + e.message); }
}

function sys(text){ const el = document.createElement("div"); el.className = "sys"; el.textContent = text; $("#msgs").append(el); bottom(false); }

async function loadSessions(preferred){
  try{
    const r = await api("/_web/api/sessions?archived=true");
    state.sessions = r.sessions || [];
    state.byId = {}; for(const s of state.sessions) state.byId[s.id] = s;
    renderList();
    if(!state.current){
      const want = preferred || localStorage.getItem("ku_web_session") || r["default"];
      const pick = state.sessions.find(s => s.id === want) || state.sessions.find(s => s.name === want) || state.sessions.find(s => s.id === r["default"]);
      if(pick) select(pick);
    } else {
      const fresh = state.sessions.find(s => s.id === state.current.id);
      if(fresh){ state.current = fresh; $("#sub").textContent = [fresh.role, fresh.harness, fresh.model, label(fresh)].filter(Boolean).join(" · "); renderList(); }
    }
  }catch(e){ sys("Could not load sessions: " + e.message); }
}

function connect(){
  if(state.es) state.es.close();
  const es = new EventSource("/_web/stream");
  state.es = es;
  es.addEventListener("hello", ev => {
    $("#net").classList.remove("on");
    const d = JSON.parse(ev.data);
    state.sessions = d.sessions || []; state.byId = {}; for(const s of state.sessions) state.byId[s.id] = s;
    renderList();
    if(!state.current && d["default"]){ const s = state.byId[d["default"]]; if(s) select(s); }
  });
  es.addEventListener("sessions", ev => {
    state.sessions = JSON.parse(ev.data) || [];
    state.byId = {}; for(const s of state.sessions) state.byId[s.id] = s;
    renderList();
  });
  es.addEventListener("message", ev => {
    const m = JSON.parse(ev.data);
    if(state.current && m.session === state.current.id) add(m);
    else if(m.session && state.byId[m.session]){ /* sidebar preview updates via sessions */ }
  });
  es.addEventListener("resync", () => { $("#net").classList.add("on"); });
  es.addEventListener("closed", () => { es.close(); sys("This page was closed. Send /web in Telegram for a new link."); });
  es.onerror = () => { $("#net").classList.add("on"); };
  es.onopen = () => { $("#net").classList.remove("on"); };
}

$("#composer").addEventListener("submit", async ev => {
  ev.preventDefault();
  const ta = $("#ta"), btn = $("#send");
  const text = ta.value.trim();
  if(!text || !state.current) return;
  ta.value = ""; ta.style.height = "auto";
  btn.disabled = true; btn.textContent = "sending…";
  const pend = document.createElement("div");
  pend.className = "b user pending"; pend.textContent = text;
  $("#msgs").append(pend); bottom(true);
  try{
    const r = await api(`/_web/api/sessions/${encodeURIComponent(state.current.id)}/send`,
      {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text})});
    if(r.seq){ state.pending.set(r.seq, pend); }
    else { pend.remove(); }
    state.atBottom = true;
  }catch(e){
    pend.remove(); ta.value = text; sys("Not sent: " + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "Send";
  }
});

$("#ta").addEventListener("input", e => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 140) + "px"; });
$("#ta").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#composer").requestSubmit(); }
});
$("#menu").addEventListener("click", () => document.body.classList.toggle("open"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("open"));
$("#arch").addEventListener("change", loadSessions);

loadSessions().then(connect);
})();
</script>
</body>
</html>
