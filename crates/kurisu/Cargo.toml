[package]
name = "kurisu"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Kurisu: a CLI-first, self-hosted lead + peer-session team driving your own claude and codex CLIs"

[dependencies]
claude-cli-acp = { path = "../claude-cli-acp" }
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "io-std", "time", "fs", "net", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
include_dir = "0.7"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kurisu"
path = "src/main.rs"

[[bin]]
name = "ku"
path = "src/main.rs"
