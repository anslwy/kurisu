[package]
name = "kurisu"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Kurisu: a CLI-first, self-hosted lead + peer-session team driving your own claude and codex CLIs"

[dependencies]
libc = "0.2"
claude-cli-acp = { path = "../claude-cli-acp" }
agent-client-protocol.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "process", "io-util", "io-std", "time", "fs", "net", "signal", "sync"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "ws"] }
portable-pty = "0.9"
tokio-stream = { version = "0.1", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
include_dir = "0.7"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

futures-util = { version = "0.3", features = ["sink"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "kurisu"
path = "src/main.rs"

[[bin]]
name = "ku"
path = "src/main.rs"
